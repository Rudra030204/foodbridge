services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: foodbridge
      POSTGRES_DB: foodbridge
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://foodbridge:foodbridge@db:5432/foodbridge
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TIME_SCALE: ${TIME_SCALE:-1}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      API_PROXY: http://backend:8000
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
